<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视频节目 - FM 网络电台</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>window.Hls||document.write('<script src="https://unpkg.com/hls.js@1/dist/hls.min.js"><\/script>');</script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎬</span>
      <h1>视频节目<span class="byline"> by 王雪豪</span></h1>
    </div>
    <nav class="nav">
      <a class="nav-btn" href="/">📻 电台</a>
      <a class="nav-btn" href="/tv">📺 电视频道</a>
      <a class="nav-btn active" href="/programs">🎬 视频节目</a>
    </nav>
  </header>

  <div class="toolbar">
    <div class="controls" id="srcChips"></div>
  </div>

  <!-- 左：播放区（约 2/3）  右：日期 + 节目列表（约 1/3） -->
  <div class="prog-layout">
    <section class="prog-stage">
      <div class="stage-video">
        <video id="video" controls playsinline preload="none"></video>
      </div>
      <div class="stage-info">
        <div class="stage-title" id="nowTitle">未选择节目</div>
        <div class="stage-meta" id="nowMeta">在右侧选择日期与节目即可播放</div>
        <div class="stage-status" id="nowStatus">加载中…</div>
      </div>
    </section>

    <aside class="prog-side">
      <div class="side-block">
        <div class="side-label">日期</div>
        <div id="dateChips" class="chips"></div>
      </div>
      <div class="side-block side-list-block">
        <div class="side-label" id="itemLabel">节目</div>
        <div id="progList" class="side-list"></div>
      </div>
    </aside>
  </div>

  <script src="/static/programs.js"></script>
</body>
</html>
